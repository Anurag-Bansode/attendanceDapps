<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="card">
    <h2>Register to Mark Attendance</h2>

    <div id="session"></div>
    <div id="error" class="error"></div>
    <div id="countdown" class="info" style="font-weight: bold; color: #ff6347;"></div>

    <label for="name">Full Name</label>
    <input id="name" type="text" placeholder="John Doe" autocomplete="name">

    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="e.g. name@example.com" autocomplete="email" autocapitalize="none" inputmode="email">

    <button id="btn" onclick="register()">Register</button>

    <div class="info">
      This device will be linked to your attendance
    </div>
  </div>

  <script src="./js/register.js"></script>
</body>
</html>
