<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Create Session</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container">
        <h1>Admin Panel</h1>
        <div class="card">
            <h2>Create New Attendance Session</h2>
            <form id="session-form">
                <div class="form-group">
                    <label for="workshop">Workshop Name</label>
                    <input type="text" id="workshop" name="workshop" placeholder="e.g., 'TechConf'" required>
                </div>
                <div class="form-group">
                    <label for="day">Day</label>
                    <input type="number" id="day" name="day" min="1" placeholder="e.g., 1" required>
                </div>
                <div class="form-group">
                    <label for="session">Session Number</label>
                    <input type="number" id="session" name="session" min="1" placeholder="e.g., 1" required>
                </div>
                <div class="form-group">
                    <label for="duration">Session Duration (minutes)</label>
                    <input type="number" id="duration" name="duration_minutes" min="1" value="60" required>
                </div>
                <button type="submit">Create Session</button>
            </form>
            <div id="session-result-container" class="result-container hidden"></div>
        </div>

        <div id="log-management-card" class="card hidden">
            <h2>Attendance Log</h2>
            <div class="button-group">
                <button id="view-log-btn">View Raw Log</button>
                <button id="download-csv-btn">Download Raw Log (CSV)</button>
            </div>
            <div id="log-container" class="log-display hidden"></div>
        </div>
    </div>

    <div class="card">
        <h2>Final Attendance Report</h2>
        <p>Generate a CSV file formatted like an attendance register, with users as rows and sessions as columns.</p>
        <button id="download-summary-btn">Download Attendance Register</button>
        <div id="summary-report-result-container" class="result-container hidden"></div>
    </div>

    <!-- Templates for dynamic content -->
    <template id="session-success-template">
        <h4>Session Created Successfully!</h4>
        <p>QR Code Page URL:</p>
        <a href="#" target="_blank" class="qr-url-link"></a>
    </template>

    <template id="error-message-template">
        <p class="error-text"></p>
    </template>

    <script src="/js/admin.js"></script>
</body>
</html>
